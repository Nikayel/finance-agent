name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
      - name: Test
        run: python -m pytest -q

  smoke:
    name: fresh-venv install smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke
        run: scripts/smoke.sh

  demo:
    name: the demo runs on a fresh clone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Demo
        run: demo/demo.sh

  history:
    name: every commit is as red or green as it claims
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole point is to replay the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --editable ".[dev]"
      - name: Replay
        # Each push replays the commits it introduced, not the whole history:
        # the cost of a full replay is commits × suite runtime, and both grow.
        # A manual run replays everything.
        run: |
          case "${{ github.event_name }}" in
            pull_request) RANGE="${{ github.event.pull_request.base.sha }}..HEAD" ;;
            push)         RANGE="${{ github.event.before }}..HEAD" ;;
            *)            RANGE="HEAD" ;;
          esac
          # A new branch reports an all-zero "before"; fall back to the lot.
          if [ "${RANGE%%..*}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD"
          fi
          echo "replaying $RANGE"
          PYTHON="$(command -v python)" scripts/check-history.sh "$RANGE"
