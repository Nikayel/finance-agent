[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbx"
dynamic = ["version"]
description = "Cheat-proof research sandbox: look-ahead-impossible, byte-reproducible strategy runs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sbx = "sbx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "sbx.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning is a test result. Determinism work in particular tends to arrive
# first as a DeprecationWarning nobody read.
filterwarnings = ["error"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
